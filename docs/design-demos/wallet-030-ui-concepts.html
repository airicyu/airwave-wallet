<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airwave 0.3.0 — Popup UI 概念稿</title>
    <style>
      :root {
        --bg: #0f1419;
        --bg-elevated: #161c24;
        --fill: #1e2630;
        --stroke: #2a3542;
        --stroke-soft: #222a34;
        --text: #e8eef4;
        --text-muted: #9aa7b4;
        --text-dim: #6b7785;
        --accent: #3d9cf0;
        --accent-dim: #2a6ea8;
        --danger: #c75050;
        --popup-w: 384px;
        --popup-h: 640px;
        --radius: 12px;
        --radius-sm: 8px;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        background: #080b0e;
        color: var(--text);
        line-height: 1.45;
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px 48px;
      }

      header.page-head h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0 0 8px;
      }

      header.page-head p {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.92rem;
        max-width: 52em;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 24px 0 16px;
      }

      .controls label {
        font-size: 0.75rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        width: 100%;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        width: 100%;
      }

      .chip {
        border: 1px solid var(--stroke);
        background: var(--bg-elevated);
        color: var(--text);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .chip:hover {
        border-color: var(--text-dim);
      }

      .chip.active {
        border-color: var(--accent);
        background: #1a2838;
      }

      .layout {
        display: grid;
        grid-template-columns: var(--popup-w) 1fr;
        gap: 28px;
        align-items: start;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .phone {
        width: var(--popup-w);
        height: var(--popup-h);
        border: 1px solid var(--stroke);
        border-radius: 16px;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
      }

      .phone-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--stroke-soft);
        background: var(--bg-elevated);
        min-height: 52px;
      }

      .bar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }

      .bar-spacer {
        flex: 1;
      }

      /* Mini wallet widget (A↔C)：非 full width，嵌在頂欄左側 */
      .bar-wallet {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: min(240px, 72%);
        padding: 4px 8px 4px 4px;
        border-radius: 999px;
        border: 1px solid var(--stroke);
        background: var(--fill);
        cursor: pointer;
        min-width: 0;
        padding: 5px 10px 5px 5px;
        background: var(--bg);
      }

      .bar-wallet .avatar {
        width: 28px;
        height: 28px;
        font-size: 0.75rem;
        flex-shrink: 0;
      }

      .bar-wallet-text {
        min-width: 0;
        text-align: left;
      }

      .bar-wallet-name {
        font-size: 0.82rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 120px;
      }

      .bar-wallet-addr {
        font-size: 0.68rem;
        color: var(--text-dim);
        font-family: ui-monospace, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 120px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background: var(--fill);
        color: var(--text-muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0;
        font-family: inherit;
      }

      .icon-btn:hover {
        color: var(--text);
        border-color: var(--text-dim);
      }

      .icon-btn.primary {
        border-color: var(--accent-dim);
        color: var(--accent);
      }

      .icon-btn.danger {
        border-color: #8a4040;
        color: #e08080;
      }

      .icon-btn.danger:hover {
        color: var(--danger);
      }

      .icon-btn.ghost-inline {
        width: 30px;
        height: 30px;
        border: none;
        background: transparent;
      }

      .icon-btn.copy {
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
      }

      .icon-btn.copy:hover {
        color: var(--accent);
      }

      .icon-btn svg {
        display: block;
      }

      .bar-subpage-title {
        font-weight: 600;
        font-size: 0.92rem;
        flex: 1;
        min-width: 0;
      }

      .phone-title {
        flex: 1;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .phone-title.center {
        text-align: center;
        margin-right: 34px;
      }

      .phone-body {
        flex: 1;
        overflow: auto;
        padding: 12px 14px;
      }

      .tab-bar {
        display: flex;
        border-top: 1px solid var(--stroke-soft);
        background: var(--bg-elevated);
      }

      .tab-bar button {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text-dim);
        padding: 12px 8px;
        font-size: 0.8rem;
        cursor: pointer;
        border-top: 2px solid transparent;
        font-family: inherit;
      }

      .tab-bar button.active {
        color: var(--accent);
        border-top-color: var(--accent);
        font-weight: 600;
      }

      .toolbar-icons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .connected-row-ui {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.82rem;
        color: var(--text-muted);
      }

      /* Account widgets */
      .account-hero {
        border: 1px solid var(--stroke);
        border-radius: var(--radius);
        background: var(--fill);
        padding: 16px;
        margin-bottom: 16px;
      }

      .account-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
      }

      .account-meta {
        flex: 1;
        min-width: 0;
      }

      .account-name {
        font-weight: 600;
        font-size: 0.95rem;
      }

      .badge {
        display: inline-block;
        font-size: 0.65rem;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid var(--stroke);
        color: var(--text-muted);
        margin-left: 6px;
        vertical-align: middle;
      }

      .addr-line {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        flex-wrap: wrap;
      }

      .addr {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-family: ui-monospace, monospace;
      }

      .btn-ghost {
        border: 1px solid var(--stroke);
        background: var(--bg);
        color: var(--text);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        cursor: pointer;
        font-family: inherit;
      }

      .btn-ghost.primary {
        border-color: var(--accent-dim);
        color: var(--accent);
      }

      .balance-block {
        margin-top: 14px;
      }

      .balance-label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .balance-main {
        font-size: 1.45rem;
        font-weight: 600;
        margin: 2px 0;
      }

      .balance-sub {
        font-size: 0.8rem;
        color: var(--text-dim);
      }

      .account-inline {
        margin-bottom: 12px;
      }

      .account-inline .stats {
        display: flex;
        gap: 20px;
        margin-top: 10px;
      }

      .stat-label {
        font-size: 0.72rem;
        color: var(--text-dim);
      }

      .stat-value {
        font-weight: 600;
        font-size: 0.95rem;
      }

      .account-compact {
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .section-head h3 {
        margin: 0;
        font-size: 0.88rem;
        font-weight: 600;
      }

      .linkish {
        font-size: 0.78rem;
        color: var(--accent);
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
      }

      .token-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Token 卡片（方案 A） */
      .token-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 12px;
        border: 1px solid var(--stroke-soft);
        border-radius: var(--radius);
        background: var(--bg-elevated);
      }

      .token-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--fill);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .token-main {
        flex: 1;
        min-width: 0;
      }

      .token-sym {
        font-weight: 600;
        font-size: 0.92rem;
        line-height: 1.25;
      }

      .token-qty {
        margin-top: 2px;
        font-size: 0.78rem;
        color: var(--text-muted);
        line-height: 1.3;
      }

      .token-usd {
        font-weight: 600;
        font-size: 0.92rem;
        color: var(--text);
        flex-shrink: 0;
        text-align: right;
        padding-left: 8px;
      }

      .activity-item {
        padding: 10px 0;
        border-bottom: 1px solid var(--stroke-soft);
        display: flex;
        gap: 10px;
      }

      .activity-top {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
      }

      .activity-detail {
        color: var(--text-muted);
        font-size: 0.82rem;
        margin-top: 2px;
      }

      .activity-when {
        color: var(--text-dim);
        font-size: 0.75rem;
      }

      .empty-hint {
        font-size: 0.78rem;
        color: var(--text-dim);
        margin-top: 12px;
        padding: 12px;
        border: 1px dashed var(--stroke);
        border-radius: var(--radius-sm);
      }

      .subpage-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .subpage-head h2 {
        margin: 0;
        font-size: 1rem;
        flex: 1;
      }

      .btn-primary {
        background: var(--accent);
        border: none;
        color: #fff;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        font-size: 0.82rem;
        cursor: pointer;
        font-family: inherit;
      }

      .account-card {
        display: flex;
        align-items: stretch;
        gap: 8px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        padding: 10px 10px 10px 12px;
        margin-bottom: 8px;
      }

      .account-card.active {
        border-color: var(--accent);
        background: #152028;
      }

      .account-card-main {
        flex: 1;
        min-width: 0;
      }

      .account-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .account-title-row .account-name {
        font-weight: 600;
        font-size: 0.9rem;
      }

      .account-addr-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }

      .account-addr-row .addr {
        font-size: 0.78rem;
        color: var(--text-muted);
        font-family: ui-monospace, monospace;
      }

      .kebab-anchor {
        position: relative;
        flex-shrink: 0;
        align-self: flex-start;
      }

      .manage-actions {
        margin-top: 20px;
        border-top: 1px solid var(--stroke-soft);
        padding-top: 12px;
      }

      .manage-action-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 0.88rem;
        color: var(--text);
      }

      .manage-action-row.neutral:hover {
        background: var(--fill);
      }

      .manage-action-row.danger {
        color: #e08080;
      }

      .manage-action-row.danger:hover {
        background: #2a1818;
      }

      .secret-card {
        border: 1px solid var(--stroke);
        border-radius: var(--radius);
        padding: 14px 12px;
        background: var(--fill);
      }

      .secret-mask {
        font-family: ui-monospace, monospace;
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        color: var(--text-muted);
        word-break: break-all;
      }

      .secret-value-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .secret-value {
        flex: 1;
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        line-height: 1.45;
        word-break: break-all;
        color: var(--text);
      }

      .reveal-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }

      .menu-item.danger {
        color: #e08080;
      }

      .menu-item.danger:hover {
        background: #2a1818;
      }

      .subpage-head.compact {
        margin-bottom: 10px;
      }

      .subpage-head.compact h2 {
        font-size: 0.95rem;
      }

      .option-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 12px 0;
      }

      .option {
        padding: 12px 14px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        font-size: 0.85rem;
        cursor: pointer;
      }

      .option.selected {
        border-color: var(--accent);
        background: #152028;
      }

      .field {
        margin-bottom: 12px;
      }

      .field label {
        display: block;
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      .field input,
      .field select {
        width: 100%;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--stroke);
        background: var(--bg);
        color: var(--text);
        font-family: inherit;
        font-size: 0.88rem;
      }

      .callout {
        padding: 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--stroke);
        background: var(--fill);
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 12px;
      }

      .callout strong {
        color: var(--text);
        display: block;
        margin-bottom: 4px;
      }

      /* 點擊外部關閉 menu（非 hover 關閉） */
      .menu-backdrop {
        position: absolute;
        inset: 0;
        z-index: 15;
        background: transparent;
      }

      .bar-end {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .menu-anchor {
        position: relative;
        z-index: 20;
        flex-shrink: 0;
      }

      .icon-btn.menu-open {
        border-color: var(--accent-dim);
        color: var(--accent);
      }

      .menu-popup {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        min-width: 232px;
        background: var(--bg-elevated);
        border: 1px solid var(--stroke);
        border-radius: var(--radius);
        padding: 6px;
        z-index: 25;
      }

      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 10px;
        border-radius: var(--radius-sm);
        font-size: 0.88rem;
        cursor: pointer;
        color: var(--text);
      }

      .menu-item:hover {
        background: var(--fill);
      }

      .menu-item-icon {
        width: 18px;
        height: 18px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .menu-item-icon svg {
        display: block;
      }

      .notes {
        font-size: 0.88rem;
        color: var(--text-muted);
      }

      .notes h2 {
        font-size: 1rem;
        color: var(--text);
        margin: 0 0 10px;
      }

      .notes ul {
        margin: 0;
        padding-left: 1.2em;
      }

      .notes li {
        margin-bottom: 8px;
      }

      .notes .ia {
        margin-top: 16px;
        padding: 14px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-sm);
        background: var(--bg-elevated);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="page-head">
        <h1>Airwave 0.3.0 · Popup UI 概念稿</h1>
        <p>
          框架約 <strong>384×640px</strong>。<strong>0.3.0 UI 定案方案 A（Soft chrome）；尚未實作進 wallet。</strong> 此檔為原型，非產品程式碼。契約：<code>docs/roadmap/0.3.0/INDEX.md</code>
        </p>
      </header>

      <div class="controls">
        <label>畫面</label>
        <div class="chip-row" id="screen-chips">
          <button type="button" class="chip active" data-screen="home-token">Home · Token</button>
          <button type="button" class="chip" data-screen="home-activity">Home · Activity</button>
          <button type="button" class="chip" data-screen="menu">Menu 開啟</button>
          <button type="button" class="chip" data-screen="accounts">Accounts</button>
          <button type="button" class="chip" data-screen="add-account">新增帳戶</button>
          <button type="button" class="chip" data-screen="settings">Settings</button>
        </div>
      </div>

      <div class="layout">
        <div class="phone" id="phone">
          <div class="menu-backdrop hidden" id="menu-backdrop" aria-hidden="true"></div>
          <div class="phone-bar" id="phone-bar"></div>
          <div class="phone-body" id="phone-body"></div>
          <div class="tab-bar hidden" id="tab-bar">
            <button type="button" data-tab="token" class="active">Token</button>
            <button type="button" data-tab="activity">Activity</button>
          </div>
        </div>

        <aside class="notes" id="notes"></aside>
      </div>
    </div>

    <script>
      const MOCK = {
        name: "Trading",
        addr: "7xKX…9f2Q",
        sol: "12.458",
        solQty: "12.458 SOL",
        solUsd: "$2,841.00",
        fiat: "≈ $2,841",
        splTokens: [
          { sym: "USDC", qty: "1,240.50 USDC", usd: "$1,240.12" },
          { sym: "BONK", qty: "4,200,000 BONK", usd: "$842.15" },
          { sym: "JUP", qty: "1,372.6839 JUP", usd: "$449.41" },
        ],
        activity: [
          { kind: "Receive", detail: "+50 USDC", when: "2h ago" },
          { kind: "Send", detail: "−2.1 SOL", when: "Yesterday" },
          { kind: "App", detail: "jup.ag · Swap", when: "Mar 28" },
        ],
        accounts: [
          { id: "acc-trading", name: "Trading", addr: "7xKX…9f2Q", kind: "signing", active: true },
          { id: "acc-watch", name: "Cold watch", addr: "9WzD…AWWM", kind: "readOnly", active: false },
          { id: "acc-dev", name: "Devnet", addr: "4fYN…3kPq", kind: "signing", active: false },
        ],
      };

      let screen = "home-token";
      let menuOpen = false;
      let focusAccountId = null;
      let privateKeyRevealed = false;

      const MENU_ITEMS = [
        {
          label: "Wallet accounts",
          action: "accounts",
          icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`,
        },
        {
          label: "Settings",
          action: "settings",
          icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
        },
        {
          label: "Connected sites",
          action: "settings",
          icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>`,
        },
      ];

      const NOTES_A =
        "頂欄 mini wallet widget：Token 為卡片列（icon · 符號 · 數量 · 右側 USD），SOL 固定第一列。Lock 在 hamburger 左側。";

      const SVG = {
        copy: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`,
        menu: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`,
        back: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>`,
        refresh: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/></svg>`,
        add: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
        save: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>`,
        lock: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>`,
        rename: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`,
        edit: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`,
        delete: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>`,
        unlink: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.84 5.16a4 4 0 010 5.66l-5.66 5.66a4 4 0 01-5.66-5.66"/><path d="M5.16 18.84a4 4 0 010-5.66l5.66-5.66a4 4 0 015.66 5.66"/></svg>`,
        kebab: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.75"/><circle cx="12" cy="12" r="1.75"/><circle cx="12" cy="19" r="1.75"/></svg>`,
        eye: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`,
        key: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`,
      };

      function ib(title, svg, extraClass = "") {
        const cls = extraClass ? `icon-btn ${extraClass}` : "icon-btn";
        return `<button type="button" class="${cls}" title="${title}" aria-label="${title}">${svg}</button>`;
      }

      const SUBPAGE_TITLES = {
        accounts: "Accounts",
        "add-account": "Add account",
        "account-rename": "Rename account",
        "account-manage": "Manage account",
        "account-reveal-key": "Reveal private key",
        settings: "Settings",
      };

      function focusedAccount() {
        return MOCK.accounts.find((a) => a.id === focusAccountId) ?? MOCK.accounts[0];
      }

      /** Demo-only placeholder；非真實私鑰 */
      function demoPrivateKeyBase58(acc) {
        if (acc.kind === "readOnly") return null;
        return `DemoBase58Secret_${acc.id}_NotARealKeyDoNotUse`;
      }

      const MASKED_SECRET_PREVIEW = "••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••";

      function barWalletMini() {
        return `
          <div class="bar-wallet" title="Switch account">
            <div class="avatar">T</div>
            <div class="bar-wallet-text">
              <div class="bar-wallet-name">${MOCK.name}</div>
              <div class="bar-wallet-addr">${MOCK.addr}</div>
            </div>
            <button type="button" class="icon-btn copy" title="Copy address" aria-label="Copy address" onclick="event.stopPropagation()">${SVG.copy}</button>
          </div>`;
      }

      function menuPopupHtml() {
        const items = MENU_ITEMS.map(
          (item) => `
          <div class="menu-item" role="menuitem" data-menu-action="${item.action}" tabindex="0">
            <span class="menu-item-icon">${item.icon}</span>
            <span>${item.label}</span>
          </div>`
        ).join("");
        return `<div class="menu-popup" id="menu-popup" role="menu">${items}</div>`;
      }

      function menuAnchorHtml() {
        const openCls = menuOpen ? " menu-open" : "";
        return `
          <div class="menu-anchor">
            <button type="button" class="icon-btn${openCls}" id="btn-menu" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="${menuOpen}">
              ${SVG.menu}
            </button>
            ${menuOpen ? menuPopupHtml() : ""}
          </div>`;
      }

      function renderTopBar() {
        const bar = document.getElementById("phone-bar");
        const isSub = screen in SUBPAGE_TITLES;
        bar.className = "phone-bar";

        if (isSub) {
          bar.innerHTML = `
            <button type="button" class="icon-btn" id="btn-back" title="Back" aria-label="Back">${SVG.back}</button>
            <div class="bar-subpage-title">${SUBPAGE_TITLES[screen]}</div>
            ${menuAnchorHtml()}`;
          return;
        }

        bar.innerHTML = `
          ${barWalletMini()}
          <div class="bar-spacer"></div>
          <div class="bar-end">
            <button type="button" class="icon-btn" id="btn-lock-home" title="Lock wallet" aria-label="Lock wallet">${SVG.lock}</button>
            ${menuAnchorHtml()}
          </div>`;
      }

      function syncMenuBackdrop() {
        const backdrop = document.getElementById("menu-backdrop");
        backdrop.classList.toggle("hidden", !menuOpen);
        backdrop.setAttribute("aria-hidden", menuOpen ? "false" : "true");
      }

      function closeAllPopups() {
        menuOpen = false;
      }

      function goAccountRename(accountId) {
        focusAccountId = accountId;
        closeAllPopups();
        screen = "account-rename";
        render();
      }

      function goAccountManage(accountId) {
        focusAccountId = accountId;
        privateKeyRevealed = false;
        closeAllPopups();
        screen = "account-manage";
        render();
      }

      function goAccountRevealKey() {
        privateKeyRevealed = false;
        closeAllPopups();
        screen = "account-reveal-key";
        render();
      }

      function syncScreenChips() {
        const chipScreen = menuOpen ? "menu" : screen;
        document.querySelectorAll("[data-screen]").forEach((b) => {
          b.classList.toggle("active", b.dataset.screen === chipScreen);
        });
      }

      function handleMenuAction(action) {
        closeAllPopups();
        if (action === "accounts") screen = "accounts";
        else if (action === "settings") screen = "settings";
        render();
      }

      function tokenRowsForList() {
        return [
          { sym: "SOL", qty: MOCK.solQty, usd: MOCK.solUsd },
          ...MOCK.splTokens,
        ];
      }

      function tokenCardHtml(t) {
        const iconLabel = t.sym === "SOL" ? "SO" : t.sym.slice(0, 2);
        return `
          <li class="token-card">
            <div class="token-icon" aria-hidden="true">${iconLabel}</div>
            <div class="token-main">
              <div class="token-sym">${t.sym}</div>
              <div class="token-qty">${t.qty}</div>
            </div>
            <div class="token-usd">${t.usd}</div>
          </li>`;
      }

      function tokenList() {
        const items = tokenRowsForList().map((t) => tokenCardHtml(t)).join("");
        const head = `<div class="section-head"><h3>Tokens</h3>${ib("Refresh balances", SVG.refresh, "ghost-inline")}</div>`;
        return `${head}<ul class="token-list">${items}</ul>`;
      }

      function activityList() {
        const items = MOCK.activity
          .map(
            (a) => `
          <div class="activity-item">
            <div style="flex:1">
              <div class="activity-top">
                <strong>${a.kind}</strong>
                <span class="activity-when">${a.when}</span>
              </div>
              <div class="activity-detail">${a.detail}</div>
            </div>
          </div>`
          )
          .join("");
        return `<h3 style="margin:0 0 8px;font-size:0.88rem">Recent</h3>${items}
          <div class="empty-hint">0.3.0 可先顯示 empty state；鏈上 Activity 索引可排後續版。</div>`;
      }

      function accountCardHtml(a) {
        return `
          <div class="account-card${a.active ? " active" : ""}">
            <div class="account-card-main">
              <div class="account-title-row">
                <span class="account-name">${a.name}</span>
                <button type="button" class="icon-btn ghost-inline" data-account-rename="${a.id}" title="Rename account" aria-label="Rename account">${SVG.rename}</button>
                ${a.active ? '<span class="badge" style="border-color:var(--accent);color:var(--accent)">Active</span>' : ""}
                ${a.kind === "readOnly" ? '<span class="badge">Read-only</span>' : ""}
              </div>
              <div class="account-addr-row">
                <span class="addr">${a.addr}</span>
                <button type="button" class="icon-btn copy ghost-inline" title="Copy address" aria-label="Copy address">${SVG.copy}</button>
              </div>
            </div>
            <div class="kebab-anchor">
              <button type="button" class="icon-btn" data-account-manage="${a.id}" title="Manage account" aria-label="Manage account">
                ${SVG.kebab}
              </button>
            </div>
          </div>`;
      }

      function accountsPage() {
        const cards = MOCK.accounts.map((a) => accountCardHtml(a)).join("");
        return `
          <div class="subpage-head compact">
            <h2 style="margin:0;flex:1">Accounts</h2>
            ${ib("Add account", SVG.add, "primary")}
          </div>
          ${cards}`;
      }

      function accountRenamePage() {
        const acc = focusedAccount();
        return `
          <p style="margin:0 0 12px;font-size:0.85rem;color:var(--text-muted)">${acc.addr}</p>
          <div class="field">
            <label>Account name</label>
            <input type="text" value="${acc.name}" />
          </div>
          <div class="toolbar-icons">
            ${ib("Save name", SVG.save, "primary")}
          </div>`;
      }

      function accountManagePage() {
        const acc = focusedAccount();
        const revealRow =
          acc.kind === "signing"
            ? `
            <div class="manage-action-row neutral" role="button" tabindex="0" data-go-reveal-key title="Reveal private key">
              <span class="menu-item-icon">${SVG.key}</span>
              <span>Reveal private key</span>
            </div>`
            : "";
        return `
          <p style="margin:0 0 4px;font-size:0.95rem;font-weight:600">${acc.name}</p>
          <p style="margin:0 0 16px;font-size:0.82rem;color:var(--text-muted);font-family:ui-monospace,monospace">${acc.addr}</p>
          ${acc.kind === "readOnly" ? '<p class="badge" style="display:inline-block;margin-bottom:12px">Read-only</p>' : ""}
          <div class="manage-actions" style="margin-top:0;border-top:none;padding-top:0">
            ${revealRow}
            <div class="manage-action-row danger" role="button" tabindex="0" data-demo-remove-account title="Remove wallet account">
              <span class="menu-item-icon">${SVG.delete}</span>
              <span>Remove wallet account</span>
            </div>
          </div>`;
      }

      function accountRevealKeyPage() {
        const acc = focusedAccount();
        const secret = demoPrivateKeyBase58(acc);
        if (!secret) {
          return `<p class="empty-hint">Read-only 帳戶無私鑰。</p>`;
        }
        if (!privateKeyRevealed) {
          return `
            <p style="margin:0 0 12px;font-size:0.85rem;color:var(--text-muted)">${acc.name} · ${acc.addr}</p>
            <div class="secret-card">
              <div class="secret-mask">${MASKED_SECRET_PREVIEW}</div>
            </div>
            <div class="reveal-toolbar">
              <button type="button" class="icon-btn primary" id="btn-reveal-key" title="Reveal private key" aria-label="Reveal private key">${SVG.eye}</button>
            </div>
            <p style="margin:12px 0 0;font-size:0.78rem;color:var(--text-dim)">Demo：尚未要求密碼；正式版再加重驗證。</p>`;
        }
        return `
          <p style="margin:0 0 12px;font-size:0.85rem;color:var(--text-muted)">${acc.name}</p>
          <div class="secret-card">
            <div class="secret-value-row">
              <div class="secret-value" id="demo-secret-text">${secret}</div>
              <button type="button" class="icon-btn primary ghost-inline" id="btn-copy-secret" title="Copy private key" aria-label="Copy private key">${SVG.copy}</button>
            </div>
          </div>
          <p style="margin:12px 0 0;font-size:0.78rem;color:var(--text-dim)">請勿分享或截圖保存私鑰。</p>`;
      }

      function addAccountPage() {
        const types = [
          "Generate new wallet",
          "Import from keystore file",
          "Import from mnemonic",
          "Import from private key",
          "Add read-only (public key)",
        ];
        return `
          <div class="subpage-head" style="margin-bottom:14px">
            <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">Choose type, then set display name.</p>
          </div>
          <div class="option-list">
            ${types.map((t, i) => `<div class="option${i === 0 ? " selected" : ""}">${t}</div>`).join("")}
          </div>
          <div class="field">
            <label>Account name</label>
            <input type="text" placeholder="e.g. Trading" />
          </div>
          <div class="callout">
            <strong>Roadmap 提醒</strong>
            Keystore／mnemonic 目前不在 0.2.0 能力內；0.3.0 若要做需另開 custody Track。
          </div>`;
      }

      function settingsPage() {
        return `
          <div class="field">
            <label>Cluster</label>
            <select><option>devnet</option><option>mainnet</option></select>
          </div>
          <div class="field">
            <label>RPC URL</label>
            <input type="url" value="https://api.devnet.solana.com" />
          </div>
          <div class="toolbar-icons" style="margin:8px 0 16px">
            ${ib("Save settings", SVG.save, "primary")}
            ${ib("Lock wallet", SVG.lock)}
          </div>
          <h3 style="font-size:0.88rem;margin:16px 0 8px">Connected sites</h3>
          <div class="connected-row-ui">
            <span>localhost:5173</span>
            ${ib("Disconnect site", SVG.unlink, "ghost-inline")}
          </div>`;
      }

      function renderBody() {
        const body = document.getElementById("phone-body");
        body.className = "phone-body";

        if (screen === "accounts") {
          body.innerHTML = accountsPage();
          return;
        }
        if (screen === "account-rename") {
          body.innerHTML = accountRenamePage();
          return;
        }
        if (screen === "account-manage") {
          body.innerHTML = accountManagePage();
          return;
        }
        if (screen === "account-reveal-key") {
          body.innerHTML = accountRevealKeyPage();
          return;
        }
        if (screen === "add-account") {
          body.innerHTML = addAccountPage();
          return;
        }
        if (screen === "settings") {
          body.innerHTML = settingsPage();
          return;
        }

        let html = "";
        if (screen === "home-token") {
          html += tokenList();
        } else if (screen === "home-activity") {
          html += activityList();
        }
        body.innerHTML = html;
      }

      function renderChrome() {
        renderTopBar();
        syncMenuBackdrop();
        const tabBar = document.getElementById("tab-bar");

        const showTabs = screen === "home-token" || screen === "home-activity";
        tabBar.classList.toggle("hidden", !showTabs);
        tabBar.querySelectorAll("button").forEach((btn) => {
          const tab = btn.dataset.tab;
          const on =
            (screen === "home-activity" && tab === "activity") ||
            (screen === "home-token" && tab === "token");
          btn.classList.toggle("active", on);
          btn.textContent = tab === "token" ? "Token" : "Activity";
          btn.removeAttribute("title");
          btn.setAttribute("aria-label", btn.textContent);
        });
      }

      function renderNotes() {
        document.getElementById("notes").innerHTML = `
          <h2>方案 A · Soft chrome</h2>
          <p>${NOTES_A}</p>
          <div class="ia">
            <strong style="color:var(--text)">IA</strong>
            <ul style="margin:8px 0 0;font-size:0.85rem">
              <li>預設 → Wallet Home（Token tab）</li>
              <li>頂欄左：mini widget（icon · name · copy icon）</li>
              <li>頂欄右：Lock icon（hamburger 左側）· Menu（hamburger）</li>
              <li>Menu → Wallet accounts／Settings／Connected sites（無 Lock）</li>
              <li>Menu（右上）→ 按鈕下方 popup；click outside 或選項導頁才關</li>
              <li>Token 卡片：icon · SYMBOL · 數量 · 右側 USD（無漲跌）；SOL 第一列</li>
              <li>底欄 → Token · Activity（文字 Tab）</li>
              <li>Manage → Reveal private key／Remove（紅）；Reveal 為獨立頁</li>
            </ul>
          </div>
          <p style="margin-top:14px;font-size:0.82rem">操作以 icon button 為主，搭配 <code title</code>／aria-label 作 tooltip。實作時 stack 導航 + manifest popup 尺寸。</p>`;
      }

      function render() {
        renderChrome();
        renderBody();
        renderNotes();
        syncScreenChips();
      }

      document.getElementById("screen-chips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-screen]");
        if (!btn) return;
        const next = btn.dataset.screen;
        if (next === "menu") {
          if (screen !== "home-token" && screen !== "home-activity") {
            screen = "home-token";
          }
          menuOpen = true;
        } else {
          screen = next;
          menuOpen = false;
        }
        render();
      });

      document.getElementById("tab-bar").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-tab]");
        if (!btn) return;
        screen = btn.dataset.tab === "activity" ? "home-activity" : "home-token";
        closeAllPopups();
        render();
      });

      document.getElementById("phone").addEventListener("click", (e) => {
        if (menuOpen && e.target.closest("#menu-backdrop")) {
          closeAllPopups();
          render();
          return;
        }
        if (e.target.closest("#btn-back")) {
          e.stopPropagation();
          closeAllPopups();
          if (screen === "account-reveal-key") screen = "account-manage";
          else if (screen === "account-rename" || screen === "account-manage") screen = "accounts";
          else if (screen in SUBPAGE_TITLES) screen = "home-token";
          render();
          return;
        }
        if (e.target.closest("#btn-lock-home")) {
          e.stopPropagation();
          closeAllPopups();
          const notes = document.getElementById("notes");
          if (notes) {
            const p = notes.querySelector("[data-demo-lock]");
            if (p) p.remove();
            const hint = document.createElement("p");
            hint.setAttribute("data-demo-lock", "");
            hint.style.cssText = "margin-top:10px;font-size:0.82rem;color:var(--accent)";
            hint.textContent = "Demo：正式版此鈕呼叫 wallet.lock。";
            notes.appendChild(hint);
          }
          return;
        }
        if (e.target.closest("#btn-menu")) {
          e.stopPropagation();
          menuOpen = !menuOpen;
          render();
          return;
        }
        const renameBtn = e.target.closest("[data-account-rename]");
        if (renameBtn) {
          e.stopPropagation();
          goAccountRename(renameBtn.getAttribute("data-account-rename"));
          return;
        }
        const manageBtn = e.target.closest("[data-account-manage]");
        if (manageBtn) {
          e.stopPropagation();
          goAccountManage(manageBtn.getAttribute("data-account-manage"));
          return;
        }
        if (e.target.closest("[data-go-reveal-key]")) {
          e.stopPropagation();
          goAccountRevealKey();
          return;
        }
        if (e.target.closest("#btn-reveal-key")) {
          e.stopPropagation();
          privateKeyRevealed = true;
          render();
          return;
        }
        if (e.target.closest("#btn-copy-secret")) {
          e.stopPropagation();
          const acc = focusedAccount();
          const secret = demoPrivateKeyBase58(acc);
          if (secret && navigator.clipboard?.writeText) {
            void navigator.clipboard.writeText(secret);
          }
          return;
        }
        if (e.target.closest("[data-demo-remove-account]")) {
          e.stopPropagation();
          screen = "accounts";
          render();
          return;
        }
        const item = e.target.closest("[data-menu-action]");
        if (item) {
          e.stopPropagation();
          handleMenuAction(item.dataset.menuAction);
        }
      });

      render();
    </script>
  </body>
</html>
