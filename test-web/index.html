<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airwave test-web</title>
  </head>
  <body>
    <main>
      <h1>Airwave test-web</h1>
      <p>請先在 Chrome 載入未封裝擴充 <code>wallet/dist</code>，於 popup 建立並解鎖錢包。</p>
      <p id="status">正在尋找 Airwave…</p>
      <button id="connect" type="button">Connect</button>
      <button id="disconnect" type="button">Disconnect</button>
      <button id="sign-msg" type="button" disabled>簽 UTF-8 訊息</button>
      <button id="sign-msg-binary" type="button" disabled>簽二進位</button>
      <button id="sign-msg-tx" type="button" disabled>簽交易當訊息</button>
      <button id="sign-tx" type="button" disabled>Sign transaction</button>
      <button id="sign-and-send-tx" type="button" disabled>Sign and send transaction</button>
      <button id="sign-and-send-tx-std" type="button" disabled>
        signAndSendTransaction（錢包代送）
      </button>
      <button id="sign-tx-fail" type="button" disabled>Sign transaction（預期模擬失敗）</button>
      <button id="airdrop" type="button" disabled title="僅 devnet RPC 有效">
        Devnet airdrop (1 SOL)
      </button>
      <pre id="log"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
