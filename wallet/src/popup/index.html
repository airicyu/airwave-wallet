<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airwave</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <section id="setup" class="flow-screen" hidden>
        <h1>Airwave</h1>
        <p>建立新錢包（請記住密碼）</p>
        <input id="setup-password" type="password" placeholder="密碼" autocomplete="new-password" />
        <input id="setup-label" type="text" placeholder="帳戶名稱（選填）" />
        <button id="btn-create" type="button">建立</button>
        <hr />
        <p>或僅新增觀察帳戶（不需密碼）</p>
        <input id="setup-watch-pk" type="text" placeholder="公鑰 base58" />
        <input id="setup-watch-label" type="text" placeholder="名稱（選填）" />
        <button id="btn-add-watch-setup" type="button">新增觀察帳戶</button>
      </section>

      <section id="locked" class="flow-screen" hidden>
        <h1>Airwave</h1>
        <p>錢包已鎖定</p>
        <input id="unlock-password" type="password" placeholder="密碼" autocomplete="current-password" />
        <button id="btn-unlock" type="button">解鎖</button>
      </section>

      <section id="create-vault-banner" class="flow-screen" hidden>
        <h1>Airwave</h1>
        <p>尚無簽名錢包，可建立密碼保護的帳戶</p>
        <input id="late-setup-password" type="password" placeholder="密碼" autocomplete="new-password" />
        <input id="late-setup-label" type="text" placeholder="帳戶名稱（選填）" />
        <button id="btn-create-late" type="button">建立簽名錢包</button>
      </section>

      <div id="shell" class="shell" hidden>
        <header class="top-bar" id="top-bar">
          <div class="bar-home" id="bar-home">
            <div class="bar-wallet-group">
              <button type="button" class="bar-wallet" id="btn-widget-accounts" title="Wallet accounts">
                <span class="avatar" id="widget-avatar" aria-hidden="true">A</span>
                <span class="bar-wallet-text">
                  <span class="bar-wallet-name" id="widget-label">Account</span>
                  <span class="bar-wallet-addr" id="widget-addr"></span>
                </span>
              </button>
              <button type="button" class="icon-btn ghost-inline" id="btn-widget-copy" title="Copy public key" aria-label="Copy public key">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
            <div class="bar-spacer"></div>
            <div class="bar-end">
              <button type="button" class="icon-btn" id="btn-lock-home" title="Lock wallet" aria-label="Lock wallet">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              </button>
              <div class="menu-anchor">
                <button type="button" class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu" aria-expanded="false">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <div id="menu-dropdown" class="menu-dropdown" hidden>
                  <button type="button" class="menu-item" data-nav="accounts">Wallet accounts</button>
                  <button type="button" class="menu-item" data-nav="settings">Settings</button>
                  <button type="button" class="menu-item" data-nav="connected-sites">Connected sites</button>
                </div>
              </div>
            </div>
          </div>
          <div class="bar-subpage" id="bar-subpage" hidden>
            <button type="button" class="icon-btn" id="btn-back" title="Back" aria-label="Back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="bar-subpage-title" id="subpage-title"></div>
            <div class="menu-anchor">
              <button type="button" class="icon-btn btn-menu-sub" title="Menu" aria-label="Menu" aria-expanded="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
              </button>
              <div class="menu-dropdown menu-dropdown-sub" hidden>
                <button type="button" class="menu-item" data-nav="accounts">Wallet accounts</button>
                <button type="button" class="menu-item" data-nav="settings">Settings</button>
                <button type="button" class="menu-item" data-nav="connected-sites">Connected sites</button>
              </div>
            </div>
          </div>
        </header>

        <div id="menu-overlay" class="menu-overlay" hidden aria-hidden="true"></div>

        <main class="screen-body">
          <section id="screen-home-token" class="screen" hidden>
            <div class="section-head">
              <h3>Tokens</h3>
              <button type="button" class="icon-btn ghost-inline" id="btn-refresh-assets" title="Refresh balances" aria-label="Refresh balances">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
              </button>
            </div>
            <ul id="home-tokens" class="token-list"></ul>
            <p id="home-assets-error" class="error" hidden></p>
          </section>

          <section id="screen-home-activity" class="screen" hidden>
            <div class="empty-state">
              <p>尚無交易歷史</p>
              <p class="muted">鏈上 Activity 將於後續版本提供。</p>
            </div>
          </section>

          <section id="screen-accounts" class="screen" hidden>
            <div class="subpage-head compact">
              <h2>Accounts</h2>
              <button type="button" class="icon-btn primary" id="btn-go-add-account" title="Add account" aria-label="Add account">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <div id="accounts-list"></div>
          </section>

          <section id="screen-add-account" class="screen" hidden>
            <p class="muted">選擇新增方式</p>
            <button type="button" class="block-btn" id="btn-generate">產生簽名帳戶</button>
            <div class="field">
              <label for="import-secret">匯入 base58 私鑰</label>
              <input id="import-secret" type="password" placeholder="base58 私鑰" autocomplete="off" />
              <button type="button" class="block-btn" id="btn-import">匯入</button>
            </div>
            <div class="field">
              <label for="watch-pk">觀察帳戶公鑰</label>
              <input id="watch-pk" type="text" placeholder="公鑰 base58" />
              <input id="watch-label" type="text" placeholder="名稱（選填）" />
              <button type="button" class="block-btn" id="btn-add-watch">新增觀察帳戶</button>
            </div>
          </section>

          <section id="screen-account-rename" class="screen" hidden>
            <p id="rename-addr-hint" class="muted addr-hint"></p>
            <div class="field">
              <label for="rename-label">Account name</label>
              <input id="rename-label" type="text" placeholder="新名稱" />
            </div>
            <button type="button" class="block-btn primary" id="btn-rename">儲存名稱</button>
          </section>

          <section id="screen-account-manage" class="screen" hidden>
            <p id="manage-name" class="manage-name"></p>
            <p id="manage-addr" class="manage-addr"></p>
            <p id="manage-readonly-badge" class="badge" hidden>Read-only</p>
            <div class="manage-actions">
              <button type="button" class="manage-action-row neutral" id="btn-go-reveal" hidden>
                <span>Reveal private key</span>
              </button>
              <button type="button" class="manage-action-row danger" id="btn-delete">Remove wallet account</button>
            </div>
          </section>

          <section id="screen-account-reveal-key" class="screen" hidden>
            <p id="reveal-hint" class="muted"></p>
            <div id="reveal-mask-block">
              <div class="secret-card">
                <div class="secret-mask">••••••••••••••••</div>
              </div>
              <div class="field">
                <label for="reveal-password">錢包密碼</label>
                <input id="reveal-password" type="password" autocomplete="current-password" />
              </div>
              <button type="button" class="icon-btn primary" id="btn-reveal-submit" title="Reveal private key" aria-label="Reveal private key">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div id="reveal-secret-block" hidden>
              <div class="secret-card">
                <div class="secret-value-row">
                  <div class="secret-value" id="reveal-secret-text"></div>
                  <button type="button" class="icon-btn primary ghost-inline" id="btn-copy-secret" title="Copy private key" aria-label="Copy private key">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  </button>
                </div>
              </div>
              <p class="muted small">請勿分享或截圖保存私鑰。</p>
            </div>
          </section>

          <section id="screen-settings" class="screen" hidden>
            <div class="field">
              <label for="cluster-select">Cluster</label>
              <select id="cluster-select">
                <option value="devnet">devnet</option>
                <option value="mainnet">mainnet</option>
              </select>
            </div>
            <div class="field">
              <label for="rpc-url">RPC URL</label>
              <input id="rpc-url" type="url" />
            </div>
            <div class="field">
              <label for="helius-api-url">Helius API URL</label>
              <input id="helius-api-url" type="text" autocomplete="off" placeholder="選填；留空則用 RPC 查持倉" />
            </div>
            <div class="field">
              <label for="jupiter-api-key">Jupiter API key</label>
              <input id="jupiter-api-key" type="password" autocomplete="off" placeholder="選填；不填＝keyless 0.5 rps，有 key＝至少 Free 1 rps" />
            </div>
            <button type="button" class="block-btn primary" id="btn-save-settings">儲存設定</button>
          </section>

          <section id="screen-connected-sites" class="screen" hidden>
            <ul id="connected-list" class="connected-list"></ul>
            <button type="button" class="block-btn" id="btn-disconnect-all">全部斷開</button>
          </section>
        </main>

        <nav id="home-tab-bar" class="tab-bar" hidden>
          <button type="button" class="tab-btn active" data-home-tab="home-token">Token</button>
          <button type="button" class="tab-btn" data-home-tab="home-activity">Activity</button>
        </nav>
      </div>

      <p id="error" class="error toast-error" hidden></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
