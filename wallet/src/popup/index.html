<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airwave</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <section id="setup" class="flow-screen" hidden>
        <h1>Airwave</h1>
        <input id="setup-password" type="text" class="wallet-pwd-masked" placeholder="密碼" autocomplete="off" />
        <input id="setup-password-2" type="text" class="wallet-pwd-masked" placeholder="再次輸入" autocomplete="off" />
        <button id="btn-create" type="button">開始</button>
      </section>

      <section id="locked" class="unlock-screen" hidden>
        <h1>Airwave</h1>
        <p>錢包已鎖定</p>
        <input id="unlock-password" type="text" class="wallet-pwd-masked" placeholder="密碼" autocomplete="off" />
        <button id="btn-unlock" class="primary-btn" type="button">解鎖</button>
      </section>

      <div id="shell" class="shell" hidden>
        <header class="top-bar" id="top-bar">
          <div class="bar-home" id="bar-home">
            <div class="bar-wallet-group">
              <button type="button" class="bar-wallet" id="btn-widget-accounts" title="Wallet accounts">
                <span class="avatar" id="widget-avatar" aria-hidden="true">A</span>
                <span class="bar-wallet-text">
                  <span class="bar-wallet-name" id="widget-label">Account</span>
                  <span class="bar-wallet-addr" id="widget-addr"></span>
                </span>
              </button>
              <button type="button" class="icon-btn ghost-inline" id="btn-widget-copy" title="Copy public key" aria-label="Copy public key">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
            <div class="bar-spacer"></div>
            <div class="bar-end">
              <button type="button" class="icon-btn" id="btn-lock-home" title="Lock wallet" aria-label="Lock wallet">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              </button>
              <div class="menu-anchor">
                <button type="button" class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu" aria-expanded="false">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <div id="menu-dropdown" class="menu-dropdown" hidden>
                  <button type="button" class="menu-item" data-nav="accounts">Wallet accounts</button>
                  <button type="button" class="menu-item" data-nav="settings">Settings</button>
                  <button type="button" class="menu-item" data-nav="connected-sites">Connected sites</button>
                  <button type="button" class="menu-item" data-nav="about">About this app</button>
                </div>
              </div>
            </div>
          </div>
          <div class="bar-subpage" id="bar-subpage" hidden>
            <button type="button" class="icon-btn" id="btn-back" title="Back" aria-label="Back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="bar-subpage-title" id="subpage-title"></div>
            <div class="menu-anchor">
              <button type="button" class="icon-btn btn-menu-sub" title="Menu" aria-label="Menu" aria-expanded="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
              </button>
              <div class="menu-dropdown menu-dropdown-sub" hidden>
                <button type="button" class="menu-item" data-nav="accounts">Wallet accounts</button>
                <button type="button" class="menu-item" data-nav="settings">Settings</button>
                <button type="button" class="menu-item" data-nav="connected-sites">Connected sites</button>
                <button type="button" class="menu-item" data-nav="about">About this app</button>
              </div>
            </div>
          </div>
        </header>

        <div id="menu-overlay" class="menu-overlay" hidden aria-hidden="true"></div>

        <main class="screen-body">
          <section id="screen-home-token" class="screen" hidden>
            <div class="section-head">
              <h3>Tokens</h3>
              <button type="button" class="icon-btn ghost-inline" id="btn-refresh-assets" title="Refresh balances" aria-label="Refresh balances">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
              </button>
            </div>
            <ul id="home-tokens" class="token-list"></ul>
            <p id="home-assets-error" class="error" hidden></p>
          </section>

          <section id="screen-home-activity" class="screen" hidden>
            <div class="empty-state">
              <p>尚無交易歷史</p>
              <p class="muted">鏈上 Activity 將於後續版本提供。</p>
            </div>
          </section>

          <section id="screen-accounts" class="screen" hidden>
            <div class="subpage-head compact">
              <h2>Accounts</h2>
              <button type="button" class="icon-btn primary" id="btn-go-add-account" title="Add account" aria-label="Add account">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <div id="accounts-list"></div>
          </section>

          <section id="screen-add-account" class="screen" hidden>
            <button type="button" class="kind-btn" data-nav-add="add-generate-seed">建立助記詞錢包<span class="kind-chev" aria-hidden="true">›</span></button>
            <button type="button" class="kind-btn" data-nav-add="add-generate">建立 Burner 錢包<span class="kind-chev" aria-hidden="true">›</span></button>
            <button type="button" class="kind-btn" data-nav-add="add-import">匯入錢包<span class="kind-chev" aria-hidden="true">›</span></button>
            <button type="button" class="kind-btn" data-nav-add="add-watch">建立觀察帳戶<span class="kind-chev" aria-hidden="true">›</span></button>
            <button type="button" class="kind-btn" data-nav-add="add-combined">建立 Combined<span class="kind-chev" aria-hidden="true">›</span></button>
          </section>

          <section id="screen-add-import" class="screen" hidden>
            <button type="button" class="kind-btn" data-nav-add="add-import-seed">助記詞<span class="kind-chev" aria-hidden="true">›</span></button>
            <button type="button" class="kind-btn" data-nav-add="add-import-secret">密鑰<span class="kind-chev" aria-hidden="true">›</span></button>
          </section>

          <section id="screen-add-import-secret" class="screen" hidden>
            <div class="field">
              <label for="import-label">名稱</label>
              <input id="import-label" type="text" placeholder="選填" autocomplete="off" />
            </div>
            <div class="field">
              <label for="import-secret">密鑰</label>
              <textarea id="import-secret" class="mono-input" rows="4" placeholder="base58 或 [193, 240, …]" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-autocomplete="none" data-lpignore="true" data-1p-ignore data-form-type="other"></textarea>
              <div id="import-secret-fmt" class="fmt"><span class="fmt-dot" aria-hidden="true"></span><span id="import-secret-fmt-text">base58 或 [bytes]</span></div>
            </div>
            <p id="import-secret-err" class="inline-err" aria-live="polite"></p>
          </section>

          <section id="screen-add-import-seed" class="screen" hidden>
            <div id="import-seed-root"></div>
          </section>

          <section id="screen-add-generate-seed" class="screen" hidden>
            <div class="field">
              <label for="generate-seed-label">名稱</label>
              <input id="generate-seed-label" type="text" placeholder="選填" autocomplete="off" />
            </div>
            <p class="seed-backup-warn">離開後無法再顯示助記詞</p>
            <div class="seed-backup-toolbar">
              <button type="button" class="icon-btn sm-inline" id="btn-copy-seed-words" title="複製" aria-label="複製"></button>
            </div>
            <div id="generate-seed-grid" class="word-grid word-grid-ro"></div>
            <div class="addr-row">
              <span id="generate-seed-pk" class="addr-row-pk"></span>
              <button type="button" class="icon-btn sm-inline" id="btn-copy-seed-pk" title="複製" aria-label="複製"></button>
            </div>
            <p id="generate-seed-err" class="inline-err" aria-live="polite"></p>
          </section>

          <section id="screen-add-generate" class="screen" hidden>
            <div id="generate-form">
              <div class="field">
                <label for="generate-label">名稱</label>
                <input id="generate-label" type="text" placeholder="選填" autocomplete="off" />
              </div>
              <p id="generate-err" class="inline-err" aria-live="polite"></p>
            </div>
            <div id="generate-success" class="add-success" hidden>
              <div class="add-success-mark" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 12.5 10 16.5 18 8"/></svg>
              </div>
              <p id="generate-success-pk" class="add-success-pk"></p>
            </div>
          </section>

          <section id="screen-add-watch" class="screen" hidden>
            <div class="field">
              <label for="watch-label">名稱</label>
              <input id="watch-label" type="text" placeholder="選填" autocomplete="off" />
            </div>
            <div class="field">
              <label for="watch-pk">地址</label>
              <input id="watch-pk" type="text" spellcheck="false" placeholder="Solana 公鑰" autocomplete="off" />
            </div>
            <p id="watch-err" class="inline-err" aria-live="polite"></p>
          </section>

          <section id="screen-add-combined" class="screen" hidden>
            <div class="field">
              <label for="combined-label">名稱</label>
              <input id="combined-label" type="text" placeholder="選填" autocomplete="off" />
            </div>
            <div class="field">
              <label class="field-label">成員</label>
              <div id="combined-chip-list" class="chip-list"></div>
              <div class="add-line">
                <input id="combined-draft" type="text" spellcheck="false" placeholder="地址，或貼上多行" autocomplete="off" />
                <button type="button" class="icon-btn sm-inline" id="btn-combined-add-chip" title="加入" aria-label="加入"></button>
              </div>
            </div>
            <p class="sec-head">本機帳戶</p>
            <div id="combined-pick-list" class="combined-pick-list"></div>
            <div id="combined-member-rows"></div>
            <p id="combined-err" class="inline-err" aria-live="polite"></p>
          </section>

          <section id="screen-account-rename" class="screen" hidden>
            <p id="rename-addr-hint" class="muted addr-hint"></p>
            <div class="field">
              <label for="rename-label">Account name</label>
              <input id="rename-label" type="text" placeholder="新名稱" />
            </div>
            <button type="button" class="block-btn primary" id="btn-rename">儲存名稱</button>
          </section>

          <section id="screen-account-manage" class="screen" hidden>
            <p id="manage-name" class="manage-name"></p>
            <p id="manage-addr" class="manage-addr"></p>
            <p id="manage-readonly-badge" class="badge" hidden>Read-only</p>
            <p id="manage-combined-badge" class="badge" hidden>Combined</p>
            <div id="manage-combined-panel" hidden>
              <p class="muted small">目前錢包地址</p>
              <p id="manage-combined-main" class="manage-addr"></p>
              <p class="sec-head">本機帳戶</p>
              <div id="manage-combined-pick-list" class="combined-pick-list"></div>
              <div class="field">
                <label for="manage-add-sub-pk">地址</label>
                <div class="add-line">
                  <input id="manage-add-sub-pk" type="text" spellcheck="false" placeholder="地址，或貼上" autocomplete="off" />
                  <button type="button" class="icon-btn sm-inline" id="btn-combined-add-sub" title="加入" aria-label="加入"></button>
                </div>
              </div>
              <ul id="manage-combined-subs" class="combined-subs-list"></ul>
            </div>
            <div class="manage-actions">
              <button type="button" class="manage-action-row neutral" id="btn-go-reveal" hidden>
                <span>Reveal private key</span>
              </button>
              <button type="button" class="manage-action-row danger" id="btn-delete">Remove wallet account</button>
            </div>
          </section>

          <section id="screen-account-reveal-key" class="screen" hidden>
            <p id="reveal-hint" class="muted"></p>
            <div id="reveal-mask-block">
              <div class="secret-card">
                <div class="secret-mask">••••••••••••••••</div>
              </div>
              <div class="field">
                <label for="reveal-password">錢包密碼</label>
                <input id="reveal-password" type="text" class="wallet-pwd-masked" autocomplete="off" />
              </div>
              <button type="button" class="icon-btn primary" id="btn-reveal-submit" title="Reveal private key" aria-label="Reveal private key">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div id="reveal-secret-block" hidden>
              <div class="secret-card">
                <div class="secret-value-row">
                  <div class="secret-value" id="reveal-secret-text"></div>
                  <button type="button" class="icon-btn primary ghost-inline" id="btn-copy-secret" title="Copy private key" aria-label="Copy private key">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  </button>
                </div>
              </div>
              <p class="muted small">請勿分享或截圖保存私鑰。</p>
            </div>
          </section>

          <section id="screen-settings" class="screen" hidden>
            <ul class="settings-hub-list" id="settings-hub-list">
              <li>
                <button type="button" class="settings-hub-row" data-settings-nav="settings-network">
                  <span class="hub-label">網路</span>
                  <span class="hub-summary" id="hub-summary-network"></span>
                </button>
              </li>
              <li>
                <button type="button" class="settings-hub-row" data-settings-nav="settings-rpc">
                  <span class="hub-label">RPC</span>
                  <span class="hub-summary hub-summary-ellipsis" id="hub-summary-rpc"></span>
                </button>
              </li>
              <li>
                <button type="button" class="settings-hub-row" data-settings-nav="settings-keys">
                  <span class="hub-label">API keys</span>
                  <span class="hub-summary" id="hub-summary-keys"></span>
                </button>
              </li>
              <li>
                <button type="button" class="settings-hub-row" data-settings-nav="settings-cu-price">
                  <span class="hub-label">Default CU price</span>
                  <span class="hub-summary" id="hub-summary-cu-price"></span>
                </button>
              </li>
              <li>
                <button type="button" class="settings-hub-row" data-settings-nav="settings-password">
                  <span class="hub-label">錢包密碼</span>
                  <span class="hub-summary">變更</span>
                </button>
              </li>
            </ul>
          </section>

          <section id="screen-settings-network" class="screen" hidden>
            <div class="network-pick-list" role="radiogroup" aria-label="目前網路">
              <label class="network-pick-row">
                <input type="radio" name="settings-cluster" value="devnet" />
                <span class="network-pick-meta">
                  <span class="network-pick-title">Devnet</span>
                  <span class="network-pick-sum">https://api.devnet.solana.com</span>
                </span>
              </label>
              <label class="network-pick-row">
                <input type="radio" name="settings-cluster" value="mainnet" />
                <span class="network-pick-meta">
                  <span class="network-pick-title">Mainnet</span>
                  <span class="network-pick-sum">https://api.mainnet-beta.solana.com</span>
                </span>
              </label>
            </div>
          </section>

          <section id="screen-settings-rpc" class="screen" hidden>
            <div class="rpc-cluster-card" data-rpc-cluster-card="devnet">
              <div class="rpc-cluster-head">
                <h3>Devnet</h3>
                <span class="rpc-cluster-badge" id="rpc-badge-devnet" hidden>目前</span>
              </div>
              <div class="settings-card">
                <div class="rpc-list" data-rpc-list="devnet"></div>
                <div class="rpc-add-bar">
                  <button type="button" class="icon-btn ghost-inline rpc-icon-btn btn-rpc-add" data-rpc-cluster="devnet" title="加入" aria-label="加入"></button>
                </div>
              </div>
            </div>
            <div class="rpc-cluster-card" data-rpc-cluster-card="mainnet">
              <div class="rpc-cluster-head">
                <h3>Mainnet</h3>
                <span class="rpc-cluster-badge" id="rpc-badge-mainnet" hidden>目前</span>
              </div>
              <div class="settings-card">
                <div class="rpc-list" data-rpc-list="mainnet"></div>
                <div class="rpc-add-bar">
                  <button type="button" class="icon-btn ghost-inline rpc-icon-btn btn-rpc-add" data-rpc-cluster="mainnet" title="加入" aria-label="加入"></button>
                </div>
              </div>
            </div>
          </section>

          <section id="screen-settings-keys" class="screen" hidden>
            <div class="field keys-field">
              <label for="helius-api-url">Helius API URL</label>
              <div class="keys-input-row">
                <input id="helius-api-url" type="text" autocomplete="off" placeholder="選填" />
                <button type="button" class="icon-btn ghost-inline keys-reveal-btn" id="btn-helius-reveal" title="顯示" aria-label="顯示"></button>
                <button type="button" class="icon-btn ghost-inline keys-confirm-btn" id="btn-helius-confirm" title="確認" aria-label="確認"></button>
              </div>
            </div>
            <div class="field keys-field">
              <label for="jupiter-api-key">Jupiter API key</label>
              <div class="keys-input-row">
                <input id="jupiter-api-key" type="text" autocomplete="off" placeholder="選填" />
                <button type="button" class="icon-btn ghost-inline keys-reveal-btn" id="btn-jupiter-reveal" title="顯示" aria-label="顯示"></button>
                <button type="button" class="icon-btn ghost-inline keys-confirm-btn" id="btn-jupiter-confirm" title="確認" aria-label="確認"></button>
              </div>
            </div>
          </section>

          <section id="screen-settings-cu-price" class="screen" hidden>
            <div class="field">
              <label for="settings-default-cu-price">micro-lamports / CU</label>
              <input id="settings-default-cu-price" type="number" inputmode="numeric" min="0" step="1" autocomplete="off" />
            </div>
          </section>

          <section id="screen-settings-password" class="screen" hidden>
            <div class="field">
              <label for="change-pwd-current">目前密碼</label>
              <input id="change-pwd-current" type="text" class="wallet-pwd-masked" autocomplete="off" />
            </div>
            <div class="field">
              <label for="change-pwd-new">新密碼</label>
              <input id="change-pwd-new" type="text" class="wallet-pwd-masked" autocomplete="off" />
            </div>
            <div class="field">
              <label for="change-pwd-confirm">再次輸入新密碼</label>
              <input id="change-pwd-confirm" type="text" class="wallet-pwd-masked" autocomplete="off" />
            </div>
            <p id="change-pwd-err" class="inline-err"></p>
          </section>

          <section id="screen-about" class="screen" hidden>
            <div class="about-version">
              <span class="hub-label">版本</span>
              <span class="about-version-value" id="about-version"></span>
            </div>
            <ul class="settings-hub-list">
              <li>
                <button type="button" class="settings-hub-row" data-about-nav="about-disclaimer">
                  <span class="hub-label">免責聲明</span>
                  <span class="kind-chev" aria-hidden="true">›</span>
                </button>
              </li>
              <li>
                <button type="button" class="settings-hub-row" data-about-nav="about-terms">
                  <span class="hub-label">使用條款</span>
                  <span class="kind-chev" aria-hidden="true">›</span>
                </button>
              </li>
            </ul>
          </section>

          <section id="screen-about-disclaimer" class="screen" hidden>
            <article id="legal-disclaimer" class="legal-doc"></article>
          </section>

          <section id="screen-about-terms" class="screen" hidden>
            <article id="legal-terms" class="legal-doc"></article>
          </section>

          <section id="screen-connected-sites" class="screen" hidden>
            <ul id="connected-list" class="connected-list"></ul>
            <button type="button" class="block-btn" id="btn-disconnect-all">全部斷開</button>
          </section>
        </main>

        <footer id="shell-dock" class="shell-dock" hidden>
          <button type="button" class="primary-btn" id="dock-primary" disabled></button>
        </footer>

        <nav id="home-tab-bar" class="tab-bar" hidden>
          <button type="button" class="tab-btn active" data-home-tab="home-token">Token</button>
          <button type="button" class="tab-btn" data-home-tab="home-activity">Activity</button>
        </nav>
      </div>

      <p id="error" class="error toast-error" hidden></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
