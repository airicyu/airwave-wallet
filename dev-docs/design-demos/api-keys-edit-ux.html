<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airwave — API keys 就地編輯</title>
    <style>
      :root {
        --bg: #0f1419;
        --bg-elevated: #161c24;
        --fill: #1e2630;
        --stroke: #2a3542;
        --stroke-soft: #222a34;
        --text: #e8eef4;
        --text-muted: #9aa7b4;
        --text-dim: #6b7785;
        --accent: #3d9cf0;
        --danger: #e06c6c;
        --ok: #6dba8a;
        --popup-w: 360px;
        --radius: 12px;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        background: #080b0e;
        color: var(--text);
      }
      .page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 48px; }
      h1 { font-size: 1.2rem; font-weight: 600; margin: 0 0 6px; }
      .lede { color: var(--text-muted); margin: 0 0 22px; font-size: 0.9rem; max-width: 40rem; }
      .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
      .cap { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; }
      .phone {
        width: var(--popup-w);
        height: 520px;
        border: 1px solid var(--stroke);
        border-radius: 16px;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--stroke-soft);
        background: var(--bg-elevated);
      }
      .top h2 { flex: 1; margin: 0; text-align: center; font-size: 0.95rem; font-weight: 600; }
      .ghost {
        width: 28px; height: 28px; border: 0; background: transparent; color: var(--text-muted);
        border-radius: 8px; display: grid; place-items: center; cursor: pointer;
      }
      .body { padding: 16px 14px; display: flex; flex-direction: column; gap: 16px; }
      .field label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
      .line { display: flex; align-items: center; gap: 4px; }
      .line input {
        flex: 1; min-width: 0; height: 40px;
        border: 1px solid var(--stroke); background: var(--fill); color: var(--text);
        border-radius: 10px; padding: 0 12px; font: inherit; font-size: 0.92rem;
        letter-spacing: 0.04em;
      }
      .line input[readonly] { color: var(--text-muted); }
      .line.editing input { border-color: var(--accent); color: var(--text); letter-spacing: 0; }
      .line input:focus { outline: none; }
      .icon {
        width: 32px; height: 32px; flex-shrink: 0;
        border: 0; background: transparent; color: var(--text-muted);
        border-radius: 8px; display: grid; place-items: center; cursor: pointer;
      }
      .icon:hover { color: var(--text); background: var(--fill); }
      .icon.ok { color: var(--ok); }
      .icon.no { color: var(--danger); }
      .icon.pressed { transform: scale(0.86); background: var(--fill); }
      .icon.ok.pressed { background: rgba(109, 186, 138, 0.18); }
      .icon.no.pressed { background: rgba(224, 108, 108, 0.16); }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>API keys — 平時編輯，點了才確認</h1>
      <p class="lede">左欄可點。平時是鉛筆；進入編輯後才出現確認與捨棄，按下時有縮放回饋。右欄是進入編輯的靜態對照。</p>
      <div class="row">
        <div>
          <div class="cap">可互動</div>
          <div class="phone" id="live"></div>
        </div>
        <div>
          <div class="cap">編輯中</div>
          <div class="phone" id="still"></div>
        </div>
      </div>
    </div>
    <script>
      const eye = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
      const pencil = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`;
      const check = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.5l4.2 4.2L19 7"/></svg>`;
      const x = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
      const back = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>`;
      const kebab = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>`;

      const fields = [
        { id: "helius", label: "Helius API URL", stored: "https://mainnet.helius-rpc.com/?api-key=demo", editing: false, revealed: false, draft: "" },
        { id: "jupiter", label: "Jupiter API key", stored: "jup_demo_key_0000", editing: false, revealed: false, draft: "" },
      ];

      function mask(v) { return v ? "••••••" : ""; }
      function shell(inner) {
        return `<div class="top"><button class="ghost" type="button">${back}</button><h2>API keys</h2><button class="ghost" type="button">${kebab}</button></div><div class="body">${inner}</div>`;
      }
      function fieldHtml(f, interactive) {
        const value = f.editing ? (f.draft || f.stored) : (f.revealed ? f.stored : mask(f.stored));
        const actions = f.editing
          ? `<button class="icon" data-act="reveal" data-id="${f.id}" type="button" title="顯示">${eye}</button>
             <button class="icon ok" data-act="commit" data-id="${f.id}" type="button" title="確認">${check}</button>
             <button class="icon no" data-act="discard" data-id="${f.id}" type="button" title="捨棄">${x}</button>`
          : `<button class="icon" data-act="reveal" data-id="${f.id}" type="button" title="顯示">${eye}</button>
             <button class="icon" data-act="edit" data-id="${f.id}" type="button" title="編輯">${pencil}</button>`;
        return `<div class="field"><label>${f.label}</label><div class="line${f.editing ? " editing" : ""}">
          <input ${interactive ? "" : "tabindex='-1'"} ${f.editing ? "" : "readonly"} value="${value}" data-id="${f.id}" />
          ${actions}</div></div>`;
      }

      const live = document.getElementById("live");
      const still = document.getElementById("still");

      function paint() {
        live.innerHTML = shell(fields.map((f) => fieldHtml(f, true)).join(""));
        const frozen = fields.map((f, i) => ({ ...f, editing: i === 0, revealed: false, draft: f.stored }));
        still.innerHTML = shell(frozen.map((f) => fieldHtml(f, false)).join(""));
      }
      paint();

      live.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const f = fields.find((x) => x.id === btn.dataset.id);
        const act = btn.dataset.act;
        if (act === "reveal") {
          f.revealed = !f.revealed;
          paint();
          return;
        }
        if (act === "edit") {
          f.editing = true;
          f.draft = f.stored;
          f.revealed = true;
          paint();
          const input = live.querySelector(`input[data-id="${f.id}"]`);
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
          return;
        }
        btn.classList.add("pressed");
        setTimeout(() => {
          if (act === "commit") f.stored = f.draft.trim();
          f.editing = false;
          f.revealed = false;
          f.draft = "";
          paint();
        }, 140);
      });
      live.addEventListener("input", (e) => {
        const input = e.target.closest("input[data-id]");
        if (!input) return;
        const f = fields.find((x) => x.id === input.dataset.id);
        if (f && f.editing) f.draft = input.value;
      });
    </script>
  </body>
</html>
